# Configure API routing, rate limits, and upstream load balancing.
#
# Author: Shuohui Liu
# Date: 19 Oct 2026
# Updated: Pei Wu, 26 Oct 2026 (rate-limit every staff API call per browser)

events { worker_connections 1024; }
http {
    log_format main '$remote_addr - $request $status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log main;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;
    upstream web_backend { server web:3000; }
    upstream users_backend { server user1:8000; server user2:8000; }
    upstream access_backend { server access1:8000; server access2:8000; }
    upstream lessons_backend { server lesson1:8000; server lesson2:8000; }
    server {
        listen 80;
        client_max_body_size 1m;
        location = /health { return 200 'ok\n'; }
        # Permit multipart overhead; User Service still caps CSV files at 1 MiB.
        location = /api/user/learners/import {
            client_max_body_size 2m;
            limit_req zone=api burst=30 nodelay;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://users_backend/learners/import;
        }
        # US-012: service-to-service only; never reachable from outside.
        location /api/user/internal/ { return 404; }
        location /api/user/ {
            limit_req zone=api burst=30 nodelay;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://users_backend/;
        }
        location /api/access/ {
            limit_req zone=api burst=30 nodelay;
            proxy_set_header Host $host;
            # US-012 counts wrong sign-in names per device; replaces any client value.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://access_backend/;
        }
        # Browser lesson uploads pass through Next's HttpOnly-cookie adapter.
        location /api/staff/lesson/ {
            limit_req zone=api burst=30 nodelay;
            client_max_body_size 11m;
            proxy_set_header Host $http_host;
            proxy_pass http://web_backend;
        }
        # The other /api/staff/ adapters (attendance, class sessions, reports).
        # The web server then calls the services on the internal network, so
        # this is where each browser's staff API calls are rate-limited.
        location /api/staff/ {
            limit_req zone=api burst=30 nodelay;
            proxy_set_header Host $http_host;
            proxy_pass http://web_backend;
        }
        location /api/lesson/internal/ { return 404; }
        location /api/lesson/ {
            limit_req zone=api burst=30 nodelay;
            proxy_set_header Host $host;
            proxy_pass http://lessons_backend/;
        }
        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
